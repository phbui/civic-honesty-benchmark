[project]
name = "civic-honesty-benchmark"
version = "1.0.0"
description = "Live-data benchmark for honest reporting by language-model agents over civic open data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phi Bui" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
cost = ["transformers>=4.44"]
test = ["pytest>=8"]
